name: Gambit CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high


  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --strict


  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  docker:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - secret-scan

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build \
            -t gambit-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t gambit-frontend:${{ github.sha }} \
            ./frontend

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: Scan backend image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            gambit-backend:${{ github.sha }}

      - name: Scan frontend image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            gambit-frontend:${{ github.sha }}

      - name: Scan backend Dockerfile
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ./backend

      - name: Scan frontend Dockerfile
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ./frontend
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Gambit stack
        run: docker compose up -d --build

      - name: Check running services
        run: docker compose ps

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres \
              pg_isready -U platform -d platform; then
              echo "PostgreSQL is ready"
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL failed to become ready"
          docker compose logs postgres
          exit 1

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health; then
              echo "Backend is healthy"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed to become healthy"
          docker compose logs backend
          exit 1

      - name: Test PostgreSQL connection
        run: |
          docker compose exec -T postgres \
            pg_isready -U platform -d platform

      - name: Run integration tests
        run: |
          docker compose exec -T backend \
            pytest -v tests/integration

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Shutdown
        if: always()
        run: docker compose down -v
        
  aws-auth-test:
    name: AWS OIDC Test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity