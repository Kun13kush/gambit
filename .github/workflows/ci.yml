name: Gambit CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:

  # ============================================================
  # FRONTEND CI
  # ============================================================

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high


  # ============================================================
  # BACKEND CI
  # ============================================================

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v tests --ignore=tests/integration

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --strict


  # ============================================================
  # SECRET DETECTION
  # ============================================================

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # DOCKER BUILD + SECURITY
  # ============================================================

  docker:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - secret-scan

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build \
            -t gambit-backend:${{ github.sha }} \
            ./app/backend

      - name: Build frontend image
        run: |
          docker build \
            -t gambit-frontend:${{ github.sha }} \
            ./app/frontend

      - name: Scan backend image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            gambit-backend:${{ github.sha }}

      - name: Scan frontend image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            gambit-frontend:${{ github.sha }}


  # ============================================================
  # INTEGRATION TESTS
  # ============================================================

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Gambit stack
        env:
          POSTGRES_DB: platform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          FRONTEND_URL: http://localhost:5173
          ENVIRONMENT: development
          APP_VERSION: 1.0.0
        run: docker compose up -d --build

      - name: Check services
        run: docker compose ps

      - name: Wait for PostgreSQL
        env:
          POSTGRES_DB: platform
          POSTGRES_USER: platform
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres \
              pg_isready -U platform -d platform; then
              echo "PostgreSQL is ready"
              sleep 5
              exit 0
            fi

            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          echo "PostgreSQL failed to become ready"
          docker compose logs postgres
          exit 1

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health; then
              echo "Backend is healthy"
              sleep 2
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed to become healthy"
          docker compose logs backend
          exit 1

      - name: Run integration tests
        run: |
          sleep 20
          docker compose exec -T backend \
            pytest -v tests/integration

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Shutdown
        if: always()
        run: docker compose down -v


  # ============================================================
  # PUSH IMAGES TO ECR
  # ============================================================

  ecr:
    name: Push Images to Amazon ECR
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    needs:
      - integration-test

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Show OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Ref name: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::732108543574:role/GitHubActionsECRRole
          aws-region: eu-west-2

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/gambit-backend:${{ github.sha }} \
            ./app/backend

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/gambit-frontend:${{ github.sha }} \
            ./app/frontend

      - name: Push backend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/gambit-backend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/gambit-frontend:${{ github.sha }}


  # ============================================================
  # ECS DEPLOYMENT
  # ============================================================

  ecs-deploy:
    name: Deploy to Amazon ECS
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    needs:
      - ecr

    permissions:
      id-token: write
      contents: read

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # CONFIGURE AWS
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::732108543574:role/GitHubActionsECRRole
          aws-region: eu-west-2


      # --------------------------------------------------------
      # VERIFY AWS
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------------
      # DOWNLOAD CURRENT BACKEND TASK DEFINITION
      # --------------------------------------------------------

      - name: Download backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition gambit-production-backend \
            --query taskDefinition \
            > backend-task-definition.json


      # --------------------------------------------------------
      # DOWNLOAD CURRENT FRONTEND TASK DEFINITION
      # --------------------------------------------------------

      - name: Download frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition gambit-production-frontend \
            --query taskDefinition \
            > frontend-task-definition.json


      # --------------------------------------------------------
      # UPDATE BACKEND IMAGE
      # --------------------------------------------------------

      - name: Update backend task definition
        id: backend-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-definition.json
          container-name: backend
          image: 732108543574.dkr.ecr.eu-west-2.amazonaws.com/gambit-backend:${{ github.sha }}


      # --------------------------------------------------------
      # UPDATE FRONTEND IMAGE
      # --------------------------------------------------------

      - name: Update frontend task definition
        id: frontend-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-definition.json
          container-name: frontend
          image: 732108543574.dkr.ecr.eu-west-2.amazonaws.com/gambit-frontend:${{ github.sha }}


      # --------------------------------------------------------
      # REGISTER BACKEND TASK DEFINITION
      # --------------------------------------------------------

      - name: Register backend task definition
        id: register-backend
        run: |
          BACKEND_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.backend-task.outputs.task-definition }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "BACKEND_TASK_DEFINITION=$BACKEND_TASK_DEFINITION" >> "$GITHUB_ENV"

          echo "Registered backend task definition:"
          echo "$BACKEND_TASK_DEFINITION"


      # --------------------------------------------------------
      # RUN DATABASE MIGRATIONS
      # ------------------------------------------------

      - name: Run database migrations
        id: migrate
        run: |
          echo "Starting Alembic migration task..."

           MIGRATION_TASK=$(aws ecs run-task \
            --cluster gambit-production \
            --launch-type FARGATE \
            --platform-version 1.4.0 \
            --task-definition "$BACKEND_TASK_DEFINITION" \
            --network-configuration 'awsvpcConfiguration={subnets=[subnet-0839debbe7ce3d789,subnet-097743546f0faa3ab],securityGroups=[sg-0c885545cf23c596c],assignPublicIp=DISABLED}' \
            --overrides '{"containerOverrides":[{"name":"backend","command":["alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          if [ -z "$MIGRATION_TASK" ] || [ "$MIGRATION_TASK" = "None" ]; then
            echo "Failed to start migration task"
            exit 1
          fi

          echo "Migration task started:"
          echo "$MIGRATION_TASK"

          echo "Waiting for migration task to stop..."

          aws ecs wait tasks-stopped \
            --cluster gambit-production \
            --tasks "$MIGRATION_TASK"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster gambit-production \
            --tasks "$MIGRATION_TASK" \
            --query 'tasks[0].containers[?name==`backend`].exitCode | [0]' \
            --output text)

          echo "Migration exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Database migration failed."

            aws ecs describe-tasks \
              --cluster gambit-production \
              --tasks "$MIGRATION_TASK" \
              --query 'tasks[0].{LastStatus:lastStatus,StoppedReason:stoppedReason,Containers:containers[].{Name:name,ExitCode:exitCode,Reason:reason}}' \
              --output table

            exit 1
          fi

          echo "Database migration completed successfully."
          
      # --------------------------------------------------------
      # REGISTER FRONTEND TASK DEFINITION
      # --------------------------------------------------------

      - name: Register frontend task definition
        id: register-frontend
        run: |
          FRONTEND_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.frontend-task.outputs.task-definition }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "FRONTEND_TASK_DEFINITION=$FRONTEND_TASK_DEFINITION" >> "$GITHUB_ENV"

          echo "Registered frontend task definition:"
          echo "$FRONTEND_TASK_DEFINITION"


      # --------------------------------------------------------
      # UPDATE BACKEND ECS SERVICE
      # --------------------------------------------------------

      - name: Update backend ECS service
        run: |
          aws ecs update-service \
            --cluster gambit-production \
            --service gambit-production-backend \
            --task-definition "$BACKEND_TASK_DEFINITION"


      # --------------------------------------------------------
      # UPDATE FRONTEND ECS SERVICE
      # --------------------------------------------------------

      - name: Update frontend ECS service
        run: |
          aws ecs update-service \
            --cluster gambit-production \
            --service gambit-production-frontend \
            --task-definition "$FRONTEND_TASK_DEFINITION"


      # --------------------------------------------------------
      # WAIT FOR BACKEND
      # --------------------------------------------------------

      - name: Wait for backend deployment
        run: |
          aws ecs wait services-stable \
            --cluster gambit-production \
            --services gambit-production-backend


      # --------------------------------------------------------
      # WAIT FOR FRONTEND
      # --------------------------------------------------------

      - name: Wait for frontend deployment
        run: |
          aws ecs wait services-stable \
            --cluster gambit-production \
            --services gambit-production-frontend


      # --------------------------------------------------------
      # VERIFY SERVICES
      # --------------------------------------------------------

      - name: Verify ECS services
        run: |
          aws ecs describe-services \
            --cluster gambit-production \
            --services \
              gambit-production-backend \
              gambit-production-frontend \
            --query 'services[].{Name:serviceName,Desired:desiredCount,Running:runningCount,Pending:pendingCount,Status:status}' \
            --output table